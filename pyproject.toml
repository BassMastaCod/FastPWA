[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "FastPWA"
dynamic = ["version"]
authors = [{name="Cody M Sommer", email="bassmastacod@gmail.com"}]
description = "Make your FastAPI app installable on mobile devices."
keywords = ["pwa", "progressive", "web", "app", "windows", "android", "iphone", "apple", "ios", "safari"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi~=0.139.2", "pydantic~=2.13.4", "jinja2~=3.1.6"]
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed"
]

[project.urls]
Repository = "https://github.com/BassMastaCod/FastPWA.git"
Issues = "https://github.com/BassMastaCod/FastPWA/issues"

[tool.pdm.version]
source = "scm"

[tool.pytest.ini_options]
pythonpath = "fastpwa"
addopts = [
    "--import-mode=importlib",
]

[project.optional-dependencies]
controller = ["fast-controller~=0.7.1"]
